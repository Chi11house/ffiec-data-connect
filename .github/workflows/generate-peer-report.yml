name: Generate FFIEC Peer Report

on:
  schedule:
    - cron: '0 9 25 1,4,7,10 *'
  workflow_dispatch:

jobs:
  build-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install ffiec-data-connect>=3.0.0 pandas>=2.0.0 openpyxl>=3.1.0

      - name: Generate peer report
        env:
          FFIEC_USERNAME: ${{ secrets.FFIEC_USERNAME }}
          FFIEC_BEARER_TOKEN: ${{ secrets.FFIEC_BEARER_TOKEN }}
        run: python generate_peer_report.py

      - name: Commit and push Excel file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add fnbo_peer_report.xlsx
          git diff --quiet && git diff --staged --quiet || git commit -m "Update FNBO peer report - $(date +%Y-%m-%d)"
          git push
